
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#fff0f6">
  <title>Oye, Ruk Zara!</title>
  <link rel="stylesheet" href="../css/style.css">
  <style>
    
@import url('https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700;800&display=swap');

* {
  margin: 0;
  padding: 0;
  box-sizing: border-box;
}

:root {
  --pink: #ff5c9a;
  --dark-pink: #e83e80;
  --purple: #9b5de5;
  --text: #443044;
  --muted: #806d80;
  --white: #ffffff;
}

body {
  min-height: 100vh;
  padding: 24px 16px;
  display: flex;
  justify-content: center;
  align-items: center;
  font-family: 'Poppins', sans-serif;
  color: var(--text);
  background: linear-gradient(
    135deg,
    #ffe0ed 0%,
    #f5e5ff 50%,
    #e0f4ff 100%
  );
  overflow-x: hidden;
}

.card {
  width: 100%;
  max-width: 440px;
  padding: 32px 24px;
  text-align: center;
  background: rgba(255, 255, 255, 0.78);
  border: 1px solid rgba(255, 255, 255, 0.9);
  border-radius: 28px;
  box-shadow: 0 18px 60px rgba(137, 72, 120, 0.15);
  backdrop-filter: blur(14px);
  animation: appear 0.7s ease both;
}

.badge {
  display: inline-block;
  padding: 7px 15px;
  margin-bottom: 18px;
  border-radius: 30px;
  color: #a52c65;
  background: #ffe0ed;
  font-size: 12px;
  font-weight: 700;
  letter-spacing: 1px;
}

.hero-heart {
  font-size: 62px;
  line-height: 1.4;
  margin: 4px 0 12px;
  animation: float 2.5s ease-in-out infinite;
}

h1 {
  font-size: clamp(27px, 7vw, 35px);
  line-height: 1.3;
  font-weight: 800;
  margin-bottom: 14px;
  color: #b52f70;
}

h2 {
  font-size: 20px;
  margin: 22px 0 16px;
}

p {
  line-height: 1.8;
}

.intro {
  color: var(--muted);
  font-size: 14px;
  margin-bottom: 22px;
}

.quote {
  padding: 16px;
  margin: 20px 0;
  border-radius: 16px;
  background: #fff0f6;
  border-left: 4px solid var(--pink);
  font-size: 14px;
  line-height: 1.8;
}

button,
.button-link {
  display: inline-block;
  border: none;
  border-radius: 14px;
  padding: 13px 22px;
  margin: 5px;
  font-family: inherit;
  font-size: 14px;
  font-weight: 700;
  text-decoration: none;
  cursor: pointer;
  transition: transform 0.2s, box-shadow 0.2s;
}

button:hover,
.button-link:hover {
  transform: translateY(-3px);
  box-shadow: 0 8px 20px rgba(180, 60, 120, 0.18);
}

button:active,
.button-link:active {
  transform: scale(0.97);
}

.primary {
  color: var(--white);
  background: linear-gradient(135deg, #ff5c9a, #e83e80);
}

.secondary {
  color: #7b43bb;
  background: #f0e4ff;
}

.buttons {
  display: flex;
  justify-content: center;
  flex-wrap: wrap;
  gap: 8px;
  margin: 18px 0;
}

#secret {
  margin-top: 24px;
  animation: appear 0.5s ease both;
}

#secret[hidden] {
  display: none;
}

#status,
#result {
  min-height: 24px;
  margin-top: 15px;
  color: #a52c65;
  font-size: 13px;
  overflow-wrap: anywhere;
}

.notice {
  margin-top: 20px;
  padding: 12px;
  border-radius: 12px;
  background: #fff7df;
  color: #735b25;
  font-size: 11px;
  line-height: 1.7;
}

footer {
  margin-top: 26px;
  color: #9b849b;
  font-size: 11px;
}

@keyframes appear {
  from {
    opacity: 0;
    transform: translateY(18px);
  }
  to {
    opacity: 1;
    transform: translateY(0);
  }
}

@keyframes float {
  0%, 100% {
    transform: translateY(0);
  }
  50% {
    transform: translateY(-8px);
  }
}

@media (max-width: 380px) {
  .card {
    padding: 26px 16px;
    border-radius: 22px;
  }

  button,
  .button-link {
    padding: 12px 16px;
    font-size: 13px;
  }
}

@media (prefers-reduced-motion: reduce) {
  *,
  *::before,
  *::after {
    animation-duration: 0.01ms !important;
    transition-duration: 0.01ms !important;
  }
}

    </style>
</head>
<body>
  <main class="card">
    <div class="badge">TOP SECRET 😂</div>
    <div class="hero-heart">🐱💗</div>

    <h1>Oye, Ruk Zara!</h1>
    <p class="intro">
      Ek bahut important sawaal hai...<br>
      Soch samajh kar jawab dena! 😂
    </p>

    <div class="quote">
      Website kholi hai toh jawab bhi dena padega! 😎
    </div>

    <h2>Samose ke saath kya?</h2>

    <div class="buttons">
      <button class="primary" data-choice="chutney">
        Chutney 🥟
      </button>
      <button class="secondary" data-choice="sauce">
        Sauce 🍅
      </button>
    </div>

    <p id="result" role="status"></p>

    <footer>
      Official Department of Samosa Research
    </footer>
  </main>

  <script src="../js/decoy.js"></script>
  <script>
    
const result = document.getElementById("result");

document.querySelectorAll("[data-choice]").forEach(button => {
  button.addEventListener("click", () => {
    result.textContent =
      button.dataset.choice === "chutney"
        ? "Team Chutney! 😂 Dil jeet liya!"
        : "Team Sauce! 😂 Ye toh serious research hai!";
  });
});

  </script>
</body>
  </html>
